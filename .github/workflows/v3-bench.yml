name: V3 SU600 bench
on:
  push:
    branches: [main, "codex/**"]
    paths: ['firmware/**', 'infrastructure/v3/**', 'backend/**', 'scripts/prepare-v3.ps1', 'compose.v3.yml', '.github/workflows/v3-bench.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install pinned ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.1
          arduino-cli lib install ArduinoJson@7.4.2 ArduinoMqttClient@0.1.8
      - name: Exercise native control state machine with sanitizers
        run: |
          python scripts/check-equipment-profiles.py
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I "$HOME/Arduino/libraries/ArduinoJson/src" firmware/kerumo_v3/src/core.cpp firmware/kerumo_v3/src/su600_driver.cpp firmware/tests/core_test.cpp -o /tmp/v3-core-test
          /tmp/v3-core-test
      - name: Compile read-only firmware for ESP32-S3 N16R8
        run: arduino-cli compile --warnings all --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB firmware/kerumo_v3
      - name: Compile read-only USB-UART variant for the original V3 serial port
        run: arduino-cli compile --warnings all --fqbn esp32:esp32:esp32s3:CDCOnBoot=default,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB firmware/kerumo_v3
      - name: Compile guarded control variant
        run: |
          sed 's/KERUMO_ENABLE_CONTROL false/KERUMO_ENABLE_CONTROL true/' firmware/kerumo_v3/config.example.h > firmware/kerumo_v3/config.local.h
          arduino-cli compile --warnings all --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB firmware/kerumo_v3
      - name: Compile extended test USB-UART variant
        run: |
          sed -e 's/KERUMO_ENABLE_CONTROL false/KERUMO_ENABLE_CONTROL true/' -e 's/KERUMO_ENABLE_EXTENDED_TEST false/KERUMO_ENABLE_EXTENDED_TEST true/' firmware/kerumo_v3/config.example.h > firmware/kerumo_v3/config.local.h
          arduino-cli compile --warnings all --fqbn esp32:esp32:esp32s3:CDCOnBoot=default,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB firmware/kerumo_v3

      - name: Compile bound equipment protocol and SHA-256 for ESP32-S3
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('backend/tests/fixtures/equipment_manifest.json').read_text()
          Path('firmware/kerumo_v3/equipment_config.local.h').write_text('#define KERUMO_EQUIPMENT_JSON ' + json.dumps(manifest) + '\n')
          PY
          arduino-cli compile --warnings all --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB firmware/kerumo_v3
      - name: Parse Windows preparation script
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/prepare-v3.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: techbaza-v3-ci
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated CI configuration
        run: |
          python3 backend/app/demo/config.py --output .env.demo
          python3 - <<'PY'
          import socket,json,pathlib
          sock=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);sock.connect(('8.8.8.8',80));host=sock.getsockname()[0];sock.close()
          pathlib.Path('.env.v3').write_text('V3_BIND_IP='+host+'\n')
          root=pathlib.Path('.local/v3');root.mkdir(parents=True)
          (root/'setup.json').write_text(json.dumps({'host':host,'ssid':'CI-NO-HARDWARE','wifi_password':'ci-not-a-real-password'}))
          PY
      - name: Build bench services and TLS identity
        run: |
          docker compose -p techbaza-v3-ci --env-file .env.demo --env-file .env.v3 -f compose.demo.yml -f compose.v3.yml build backend v3-gateway
          docker run --rm -i --network none -v "$PWD/.local/v3:/work:rw" --entrypoint python3 kerumo-v3-gateway:local /opt/kerumo/generate.py
      - name: Seed and verify idempotent physical device enrollment
        run: |
          docker compose -p techbaza-v3-ci --env-file .env.demo -f compose.demo.yml up -d --wait postgres mosquitto
          docker compose -p techbaza-v3-ci --env-file .env.demo -f compose.demo.yml run --rm -T backend alembic upgrade head
          docker compose -p techbaza-v3-ci --env-file .env.demo -f compose.demo.yml run --rm -T backend python -m app.demo.seed
          docker compose -p techbaza-v3-ci --env-file .env.demo -f compose.demo.yml run --rm -T backend python -m app.bench.su600
          docker compose -p techbaza-v3-ci --env-file .env.demo -f compose.demo.yml run --rm -T backend python -m app.bench.su600
          docker compose -p techbaza-v3-ci --env-file .env.demo --env-file .env.v3 -f compose.demo.yml -f compose.v3.yml up -d --no-build --wait --wait-timeout 90 backend simulator v3-gateway
      - name: Verify TLS, device ACL, physical telemetry and command bridge
        run: docker compose -p techbaza-v3-ci --env-file .env.demo -f compose.demo.yml run --rm -T --no-deps -e TECHBAZA_V3_ACCEPTANCE=1 -v "$PWD/.local/v3:/work:ro" backend python -m app.bench.check
      - name: Logs on failure
        if: failure()
        run: docker compose -p techbaza-v3-ci --env-file .env.demo --env-file .env.v3 -f compose.demo.yml -f compose.v3.yml logs --tail 100 backend v3-gateway
      - name: Cleanup isolated CI services
        if: always()
        run: docker compose -p techbaza-v3-ci --env-file .env.demo --env-file .env.v3 -f compose.demo.yml -f compose.v3.yml down -v
