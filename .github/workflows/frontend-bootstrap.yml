name: Frontend checks

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/export_openapi.py'
      - 'scripts/check-stage9-op3.ps1'
      - '.github/workflows/frontend-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend schema dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Export backend OpenAPI snapshot
        run: python scripts/export_openapi.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Bootstrap frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Generate TypeScript API contract
        working-directory: frontend
        run: npm run api:generate
      - name: Verify OpenAPI contract
        working-directory: frontend
        run: npm run api:verify
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Commit generated Stage 9.3 contract files
        shell: bash
        run: |
          git add frontend/package-lock.json frontend/src/lib/api/openapi.json frontend/src/lib/api/schema.d.ts
          if git diff --cached --quiet; then
            echo "Generated files are already tracked and current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Track generated Stage 9.3 API contract"
          git push origin HEAD:main
      - name: Upload Stage 9.3 bootstrap files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-stage9-op3-bootstrap
          path: |
            frontend/package-lock.json
            frontend/src/lib/api/openapi.json
            frontend/src/lib/api/schema.d.ts
          if-no-files-found: error
          retention-days: 3
