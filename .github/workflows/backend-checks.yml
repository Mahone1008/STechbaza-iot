name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infrastructure/mosquitto/**'
      - '.github/workflows/backend-checks.yml'
      - 'compose.demo.yml'
      - 'scripts/check-stage8-op4.ps1'
      - 'scripts/check-stage8-op5.ps1'
      - 'scripts/check-stage8-op6.ps1'
      - 'scripts/check-stage-h-op1.ps1'
      - 'scripts/check-stage-h-op2.ps1'
      - 'scripts/check-stage-h-op3.ps1'
      - 'scripts/check-stage-h-final.ps1'
      - 'compose.acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: techbaza_test
          POSTGRES_USER: techbaza_test
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techbaza_test -d techbaza_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://techbaza_test:ci_test_only@127.0.0.1:5432/techbaza_test
      MQTT_HOST: 127.0.0.1
      MQTT_PORT: '1883'
      TECHBAZA_RUN_DB_TESTS: '1'
      TECHBAZA_RUN_MQTT_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Start isolated MQTT broker
        run: >-
          docker run -d --name test-mqtt -p 127.0.0.1:1883:1883
          -v "$PWD/infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"
          eclipse-mosquitto:2
      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Verify telemetry, auth and notification migration rollback and upgrade
        working-directory: backend
        run: |
          python -m alembic downgrade 20260926_0016
          python -m alembic upgrade head
          python -m alembic downgrade 20260925_0015
          python -m alembic upgrade head
          python -m alembic downgrade 20260925_0014
          python -m alembic upgrade head
      - name: Run regression and integration checks
        working-directory: backend
        run: python -m app.tools.backend_check
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install -r backend/requirements-browser-tests.txt
          python -m playwright install --with-deps chromium
      - name: Verify authentication in real Chromium
        working-directory: backend
        env:
          TECHBAZA_RUN_BROWSER_TESTS: '1'
        run: python -m app.tools.browser_auth_check

  demo:
    needs: hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral demo credentials
        run: python3 backend/app/demo/config.py --output .env.demo
      - name: Build and prepare isolated demo
        run: |
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml build backend
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml up -d postgres mosquitto
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml run --rm -T backend alembic upgrade head
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml run --rm -T -e TECHBAZA_RUN_DB_TESTS=1 -e TECHBAZA_RUN_MQTT_TESTS=1 backend python -m app.tools.backend_check
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml run --rm -T backend python -m app.demo.seed
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml run --rm -T backend python -m app.demo.seed
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml up -d --wait --wait-timeout 90 backend simulator
      - name: Verify real HTTP and MQTT demo scenarios
        run: docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml exec -T backend python -m app.demo.check
      - name: Verify durable simulator restart
        run: |
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml exec -T simulator python -m app.demo.simulator checkpoint
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml restart simulator
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml exec -T simulator python -m app.demo.simulator verify-restart
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml exec -T backend python -m app.demo.check --quick
      - name: Verify backend restart with offline commands and TTL expiry
        run: |
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml exec -T backend python -m app.demo.resilience prepare-restart
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml restart backend
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml exec -T backend python -m app.demo.resilience verify-restart
      - name: Verify real broker outage and reconnect
        run: |
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml stop mosquitto
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml exec -T backend python -m app.demo.resilience broker-down
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml start mosquitto
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml exec -T backend python -m app.demo.resilience broker-recovered
          docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml exec -T backend python -m app.demo.check --quick
      - name: H-04 and H-05 final user acceptance
        shell: pwsh
        run: ./scripts/check-stage-h-final.ps1
      - name: Demo logs on failure
        if: failure()
        run: docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml logs --tail 120 backend simulator
      - name: Stop isolated CI demo
        if: always()
        run: docker compose -p techbaza-demo --env-file .env.demo -f compose.demo.yml down
