name: V4 LTE bench
on:
  push:
    branches: [main, "codex/**"]
    paths: ['firmware/**', 'infrastructure/v3/**', 'backend/**', 'scripts/*v4.ps1', 'compose.v4.yml', '.github/workflows/v4-bench.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install pinned ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.1
          arduino-cli lib install ArduinoJson@7.4.2 ArduinoMqttClient@0.1.8
      - name: Exercise cellular recovery with sanitizers
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined firmware/tests/cellular_test.cpp -o /tmp/v4-cellular-test
          /tmp/v4-cellular-test
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I firmware/tests/stubs firmware/tests/modbus_adapter_test.cpp firmware/kerumo_v3/src/core.cpp -o /tmp/v4-modbus-test
          /tmp/v4-modbus-test
      - name: Compile read-only LTE firmware for the original USB-UART port
        run: |
          cp firmware/kerumo_v3/lte_config.example.h firmware/kerumo_v3/lte_config.local.h
          arduino-cli compile --warnings all --fqbn esp32:esp32:esp32s3:CDCOnBoot=default,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB firmware/kerumo_v3
      - name: Compile commissioned LTE variant using existing control guards
        run: |
          sed -e 's/KERUMO_ENABLE_CONTROL false/KERUMO_ENABLE_CONTROL true/' -e 's/KERUMO_ENABLE_EXTENDED_TEST false/KERUMO_ENABLE_EXTENDED_TEST true/' -e 's/KERUMO_ENABLE_REMOTE_OPERATION false/KERUMO_ENABLE_REMOTE_OPERATION true/' firmware/kerumo_v3/lte_config.example.h > firmware/kerumo_v3/lte_config.local.h
          arduino-cli compile --warnings all --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB firmware/kerumo_v3
      - name: Parse Windows preparation and physical probe scripts
        shell: pwsh
        run: |
          foreach ($name in @('prepare-v4.ps1', 'check-v4.ps1', 'update-vfd-service.ps1')) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "scripts/$name"), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated CI source identity and endpoint
        run: |
          python3 backend/app/demo/config.py --output .env.demo
          python3 - <<'PY'
          import json, pathlib, secrets
          source=pathlib.Path('.local/v3');source.mkdir(parents=True)
          (source/'identity.json').write_text(json.dumps({'uid':'KERUMO-V3-SU600-001','password':secrets.token_hex(32)}))
          root=pathlib.Path('.local/v4');root.mkdir(parents=True)
          (root/'setup.json').write_text(json.dumps({'host':'v4-gateway','port':8883}))
          PY
      - name: Build gateway and backend
        run: docker compose -p kerumo-v4-ci --env-file .env.demo -f compose.demo.yml -f compose.v4.yml build backend v4-gateway
      - name: Verify endpoint renewal and limited observer credentials
        run: |
          docker run --rm --network none -v "$PWD/infrastructure/v3:/tests:ro" --entrypoint python3 kerumo-v4-gateway:local /tests/test_v4.py
          docker run --rm --network none -v "$PWD/.local/v3:/source:ro" -v "$PWD/.local/v4:/work:rw" --entrypoint python3 kerumo-v4-gateway:local /opt/kerumo/v4.py
      - name: Seed isolated test database
        run: |
          docker compose -p kerumo-v4-ci --env-file .env.demo -f compose.demo.yml up -d --wait postgres mosquitto
          docker compose -p kerumo-v4-ci --env-file .env.demo -f compose.demo.yml run --rm -T backend alembic upgrade head
          docker compose -p kerumo-v4-ci --env-file .env.demo -f compose.demo.yml run --rm -T backend python -m app.demo.seed
          docker compose -p kerumo-v4-ci --env-file .env.demo -f compose.demo.yml run --rm -T backend python -m app.bench.su600 --disable-control
          docker compose -p kerumo-v4-ci --env-file .env.demo -f compose.demo.yml -f compose.v4.yml up -d --no-build --wait backend v4-gateway
      - name: Reject stale, Wi-Fi and incomplete samples in the physical probe
        run: docker compose -p kerumo-v4-ci --env-file .env.demo -f compose.demo.yml run --rm -T --no-deps backend python -m unittest discover -s tests -p test_v4_probe.py
      - name: Verify TLS identity, ACL and cellular telemetry/command/result integration
        run: docker compose -p kerumo-v4-ci --env-file .env.demo -f compose.demo.yml -f compose.v4.yml run --rm -T --no-deps -e TECHBAZA_V3_ACCEPTANCE=1 -e KERUMO_BENCH_TRANSPORT=cellular -v "$PWD/.local/v4:/work:ro" backend python -m app.bench.check
      - name: Logs on failure
        if: failure()
        run: docker compose -p kerumo-v4-ci --env-file .env.demo -f compose.demo.yml -f compose.v4.yml logs --tail 80 backend v4-gateway
      - name: Cleanup isolated CI services
        if: always()
        run: docker compose -p kerumo-v4-ci --env-file .env.demo -f compose.demo.yml -f compose.v4.yml down -v
