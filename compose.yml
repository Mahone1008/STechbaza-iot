services:
  postgres:
    image: postgres:16-alpine
    container_name: techbaza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techbaza}
      POSTGRES_USER: ${POSTGRES_USER:-techbaza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techbaza_dev_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techbaza} -d ${POSTGRES_DB:-techbaza}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: techbaza-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: ./backend
    container_name: techbaza-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-techbaza}:${POSTGRES_PASSWORD:-techbaza_dev_only}@postgres:5432/${POSTGRES_DB:-techbaza}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_CLIENT_ID: techbaza-backend
      MQTT_TEST_TOPIC: techbaza/test/backend
      MQTT_TELEMETRY_TOPIC: techbaza/devices/+/telemetry
      MQTT_HEARTBEAT_TOPIC: techbaza/devices/+/heartbeat
      MQTT_COMMAND_TOPIC_TEMPLATE: techbaza/devices/{device_uid}/commands
      MQTT_COMMAND_ACK_TOPIC: techbaza/devices/+/commands/ack
      MQTT_COMMAND_RESULT_TOPIC: techbaza/devices/+/commands/result
      MQTT_PUBLISH_TIMEOUT_SECONDS: 3
      DEVICE_ONLINE_TIMEOUT_SECONDS: 90
      SYSTEM_ALARM_POLL_SECONDS: 5
      SYSTEM_ALARM_BATCH_SIZE: 100
      COMMAND_RETRY_INTERVAL_SECONDS: 10
      COMMAND_RELIABILITY_POLL_SECONDS: 2
      COMMAND_RELIABILITY_BATCH_SIZE: 100
      COMMAND_RESULT_TIMEOUT_SECONDS: ${COMMAND_RESULT_TIMEOUT_SECONDS:-120}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:-techbaza-local-development-only-secret-change-before-production}
      ACCOUNT_KEY_SECRET: ${ACCOUNT_KEY_SECRET:?Set ACCOUNT_KEY_SECRET; preserve the old AUTH_ACCESS_TOKEN_SECRET when upgrading}
      ACCOUNT_KEY_PREVIOUS_SECRETS: ${ACCOUNT_KEY_PREVIOUS_SECRETS:-[]}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-techbaza}
      AUTH_TOKEN_AUDIENCE: ${AUTH_TOKEN_AUDIENCE:-techbaza-api}
      AUTH_BROWSER_ORIGINS: ${AUTH_BROWSER_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-300}
      AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-30}
      AUTH_LOGIN_ACCOUNT_LIMIT: ${AUTH_LOGIN_ACCOUNT_LIMIT:-10}
      AUTH_SESSION_IP_LIMIT: ${AUTH_SESSION_IP_LIMIT:-120}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-disabled}
      MAIL_PUBLIC_URL: ${MAIL_PUBLIC_URL:-http://127.0.0.1:3000}
      MAIL_LOCAL_DIRECTORY: /private/mail
      MAIL_FROM: ${MAIL_FROM:-KERUMO <access@kerumo.example.com>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TELEMETRY_STALE_AFTER_SECONDS: ${TELEMETRY_STALE_AFTER_SECONDS:-120}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.local/mail:/private/mail
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
