server {
    listen 8080;
    server_name _;
    client_max_body_size 64k;
    # Only the host bridge gateway is trusted when Tailscale Serve forwards to
    # loopback. Untrusted remote requests cannot choose the IP recorded by APIs.
    set_real_ip_from 172.29.113.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    location /api/ {
        proxy_pass http://staff-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /health { return 404; }
    location /docs { return 404; }
    location /openapi.json { return 404; }
    location / {
        proxy_pass http://staff-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
