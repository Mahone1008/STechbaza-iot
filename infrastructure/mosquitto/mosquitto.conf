# Локальна конфігурація MQTT-брокера для розробки TechBaza.
# У production анонімний доступ буде вимкнено, а з'єднання працюватимуть через TLS.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
